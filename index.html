<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双人专属游戏厅</title>
    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --gold: #fbbf24; --blue: #3b82f6; 
            --green: #10b981; --text: #f3f4f6; --gray: #888;
        }
        body {
            background-color: var(--bg); color: var(--text); font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        h1 {
            font-size: 32px; color: var(--gold); margin-bottom: 40px;
            letter-spacing: 2px; text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            text-align: center;
        }
        .game-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; width: 100%; max-width: 800px;
        }
        .game-card {
            background: var(--card); border-radius: 20px; padding: 25px;
            text-decoration: none; color: var(--text); display: flex; flex-direction: column;
            border: 2px solid transparent; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; overflow: hidden;
        }
        .game-card:hover {
            transform: translateY(-5px); border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.2);
        }
        .card-icon { font-size: 40px; margin-bottom: 15px; }
        .card-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .card-desc { font-size: 14px; color: var(--gray); line-height: 1.5; flex-grow: 1; }
        .card-tag {
            position: absolute; top: 15px; right: 15px;
            padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .tag-1v1 { background: rgba(59, 130, 246, 0.2); color: var(--blue); }
        .tag-single { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .footer { margin-top: 50px; font-size: 12px; color: #444; text-align: center; }
    </style>
</head>
<body>

    <h1>专属双人游戏厅</h1>

    <div class="game-grid">
        <!-- 1. 默契对弈 -->
        <a href="./sync.html" class="game-card">
            <div class="card-tag tag-1v1">双人联机</div>
            <div class="card-icon">🧠</div>
            <div class="card-title">默契猜词</div>
            <div class="card-desc">通过 4 位数房间号联机，双方盲选同一个词。测试一下你们的灵魂契合度。</div>
        </a>

        <!-- 2. 五子棋 AI -->
        <a href="./gomoku.html" class="game-card">
            <div class="card-tag tag-single">人机对战</div>
            <div class="card-icon">⚫⚪</div>
            <div class="card-title">五子棋 AI</div>
            <div class="card-desc">内置 Alpha-Beta 剪枝算法的五子棋，与聪明的人工智能一决高下。</div>
        </a>

        <!-- 3. 俄罗斯方块 -->
        <a href="./tetris.html" class="game-card">
            <div class="card-tag tag-single">单机</div>
            <div class="card-icon">🧱</div>
            <div class="card-title">经典俄罗斯方块</div>
            <div class="card-desc">带有物理重力掉落和连击特效的俄罗斯方块，适合一个人打发时间。</div>
        </a>

        <!-- 4. 日历拼图 -->
        <a href="./calendar.html" class="game-card">
            <div class="card-tag tag-single">单机</div>
            <div class="card-icon">📅</div>
            <div class="card-title">日历拼图</div>
            <div class="card-desc">挑战每一天的日历拼图，利用 10 块木板拼出当天的日期。</div>
        </a>
        <!-- 5. 圣诞树 -->
        <a href="./christmas.html" class="game-card">
            <div class="card-tag tag-single">彩蛋</div>
            <div class="card-icon">🎄</div>
            <div class="card-title">圣诞树</div>
            <div class="card-desc">纯代码绘制的粒子圣诞树，点击屏幕会有惊喜。</div>
        </a>
    </div>

    <div class="footer">Made with ❤️ for two.</div>

</body>
</html>
